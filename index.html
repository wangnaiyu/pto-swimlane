<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTO Swimlane</title><link rel="stylesheet" href="/static-assets/icomoon/devui-icon.css"></head><body><div id="app"><div id="startup-status" role="status" style="padding:24px;font:14px sans-serif;color:#333">正在加载上传页面…</div><button id="startup-retry" type="button" onclick="location.reload()" hidden style="margin:0 24px">重新加载</button></div><script>setTimeout(function(){var s=document.getElementById('startup-status');if(s){s.textContent='页面加载较慢，请稍候，或点击重新加载。';document.getElementById('startup-retry').hidden=false;}},15000);window.addEventListener('error',function(e){var s=document.getElementById('startup-status');if(s){s.textContent='页面资源加载失败，请重新加载。';document.getElementById('startup-retry').hidden=false;}},true);</script><script type="module" src="/src/bootstrap.ts"></script></body></html>
